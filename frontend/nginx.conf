# admin 로그인에만 거는 속도 제한. 앱의 IP 단위 지연과 **별개로** 한 겹 더 둔다 —
# 애플리케이션에 닿기 전에 걸러지므로 Argon2 계산 자체를 안 하게 된다.
limit_req_zone $binary_remote_addr zone=adminlogin:1m rate=10r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── 전송 압축 ──────────────────────────────────────────────────────────────
  # 첫 방문에 코드만 530KB 가 나갔다(`Content-Encoding` 헤더가 아예 없었다). 압축하면 147KB 다 —
  # 느린 모바일 회선(1.5Mbps)에서 2.7초가 0.8초가 된다. 재방문은 위 `immutable` 이 이미 막아 주니
  # 이 설정이 사는 자리는 **처음 온 사람**이다.
  #
  # 이미지·폰트(woff2)는 목록에 없다 — 그 자체가 압축 포맷이라 다시 압축하면 CPU 만 쓰고
  # 크기는 거의 안 준다. 1KB 미만도 건너뛴다(헤더가 이득보다 크다).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/manifest+json image/svg+xml;

  # ── 실사용자 신청 (설계서 Phase 3) ─────────────────────────────────────────
  # 비로그인 공개 페이지. 게이트는 admin 승인이고, 대기열 오염은 IP당 하루 상한이 막는다.
  location /apply/ {
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri /apply.html;
  }

  # ── 운영 관리 ──────────────────────────────────────────────────────────────
  # **경로는 배포 설정이 정한다**(ADMIN_PATH). 저장소에 값을 적지 않는 이유는
  # INDUSTRY_LOOKUP_URL 을 안 적은 것과 같다 — 다만 **경로 숨김은 방어가 아니라 소음 감소**다.
  # API 는 어차피 열려 있고, 방어는 Argon2id·TOTP·IP 지연·HttpOnly 쿠키·감사가 진다.
  location /ops/ {
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri /admin.html;
  }

  # 로그인만 따로 속도 제한. burst 를 두어 정상 사용자의 오타 몇 번은 통과시킨다.
  location = /api/admin/login {
    limit_req zone=adminlogin burst=5 nodelay;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # 해시가 박힌 자산은 내용이 바뀌면 파일명이 바뀐다 — 영구 캐시가 안전하고, 재방문이 빠르다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA — 새로고침 시 404가 나지 않도록 index.html로 폴백
  #
  # index.html은 **반드시 매번 서버에 물어야 한다.** 이 파일만이 어떤 해시의 번들을 쓸지 가리키기
  # 때문이다. Cache-Control이 없으면 브라우저는 Last-Modified로 유효기간을 스스로 추정해(휴리스틱
  # 캐싱) 옛 HTML을 재사용하고, 그러면 배포를 해도 사용자는 옛 화면을 계속 본다 — 실제로 겪었다.
  # no-cache는 '캐시하지 마라'가 아니라 '쓰기 전에 물어봐라'다. 바뀌지 않았으면 304로 끝난다.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # 같은 오리진으로 프록시하면 CORS 설정이 필요 없다
  #
  # **상한을 적어 둔다.** 예전에는 아무것도 안 적어 nginx 기본 60초가 유일한 상한이었고, 그 값이
  # 어디에도 안 적혀 있으니 "로딩이 1분"의 정체를 아무도 못 짚었다. `/api/mydata/link` 가 실측
  # 57초로 그 선에 닿은 적이 있다(`FollowUpExecutorConfig`). 프론트도 같은 60초를 무거운 진입로에
  # 쓴다(`lib/api.ts` SLOW_TIMEOUT_MS) — **두 상한을 같은 값으로 맞춰** 어느 쪽이 먼저 끊든
  # 사용자가 겪는 시간이 달라지지 않게 한다.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
