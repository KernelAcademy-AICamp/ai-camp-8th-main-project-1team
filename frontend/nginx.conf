server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 해시가 박힌 자산은 내용이 바뀌면 파일명이 바뀐다 — 영구 캐시가 안전하고, 재방문이 빠르다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA — 새로고침 시 404가 나지 않도록 index.html로 폴백
  #
  # index.html은 **반드시 매번 서버에 물어야 한다.** 이 파일만이 어떤 해시의 번들을 쓸지 가리키기
  # 때문이다. Cache-Control이 없으면 브라우저는 Last-Modified로 유효기간을 스스로 추정해(휴리스틱
  # 캐싱) 옛 HTML을 재사용하고, 그러면 배포를 해도 사용자는 옛 화면을 계속 본다 — 실제로 겪었다.
  # no-cache는 '캐시하지 마라'가 아니라 '쓰기 전에 물어봐라'다. 바뀌지 않았으면 304로 끝난다.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # 같은 오리진으로 프록시하면 CORS 설정이 필요 없다
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
