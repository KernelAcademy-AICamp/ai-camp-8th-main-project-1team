# 운영 스택 — 로컬 총연습과 EC2에서 같은 파일을 쓴다.
#
#   로컬 총연습(컨테이너 MySQL 포함):
#     docker compose -f docker-compose.prod.yml -f docker-compose.prod.local-db.yml \
#       --profile local-db --env-file deploy/.env up -d --build
#
#   외부 DB(RDS 등)를 쓸 때:
#     deploy/.env 의 DB_HOST 를 엔드포인트로 바꾸고
#     docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# 설계 원칙 세 가지.
#  ① 외부로 나가는 문은 프론트 nginx 하나뿐이다. `/`는 SPA, `/api/`는 backend로 프록시하므로
#     브라우저가 보는 오리진이 하나다 — CORS가 발생할 일 자체가 없다. actuator는 `/api` 밖
#     경로라 이 프록시로 도달할 수 없어 내부 헬스체크 전용이 자동으로 보장된다.
#  ② 마이데이터 서버(8082)는 어디에도 발행하지 않는다. ports 없음 + internal 망(아웃바운드조차
#     없음) + 방화벽 규칙 없음의 3중이다. 격리는 "자르지 않는 것" 목록에 있다.
#  ③ container_name을 박지 않는다. blue-green으로 두 벌을 띄울 때 이름이 충돌해 새 쪽이 못 뜬다.
#  ④ 서비스마다 메모리 한도를 못 박는다. Dockerfile의 -XX:MaxRAMPercentage=60은 **컨테이너 한도**를
#     읽는데, 한도가 없으면 호스트 전체를 한도로 본다 — 4GB 인스턴스에서 JVM 두 개가 각각 2.4GB를
#     요구해 OOM Killer가 온다. 로컬 총연습(호스트 7.7GB)에서 실제로 backend 559MiB ·
#     mydata 445MiB까지 늘어나는 것을 확인하고 넣었다. 합계는 t3.medium(4GB) 기준으로 잡았다.

x-logging: &default-logging
  # 로그가 디스크를 채워 서버가 죽는 흔한 사고를 막는다. 작은 인스턴스일수록 중요하다.
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  # 컨테이너 MySQL — `--profile local-db` 를 줄 때만 뜬다.
  # RDS를 쓰는 배포에서는 이 서비스가 아예 기동되지 않아 인스턴스 메모리를 잠식하지 않는다.
  mysql:
    profiles: ["local-db"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?deploy/.env 에 MYSQL_ROOT_PASSWORD 를 넣어라}
      MYSQL_DATABASE: ${DB_NAME:-finntech}
      MYSQL_USER: ${DB_USER:-finntech}
      MYSQL_PASSWORD: ${DB_PASSWORD:?deploy/.env 에 DB_PASSWORD 를 넣어라}
      TZ: Asia/Seoul
    # 버퍼풀을 명시한다. 기본 128MB로는 13.6M행을 다룰 때 디스크만 읽는다.
    # 컨테이너 한도(1g) 안에서 절반을 데이터 캐시로 준다.
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
    mem_limit: 1g
    volumes:
      - mysql-data:/var/lib/mysql
      # 첫 기동 때 두 DB(finntech, finntech_mydata)를 만든다. 스키마는 각 모듈 Flyway 소관.
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *default-logging
    restart: unless-stopped

  # 마이데이터 제공자 — 완전 비공개. 본체만 서비스명으로 부른다.
  backend-mydata:
    build:
      context: ./backend-mydata
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYDATA_DB_NAME: ${MYDATA_DB_NAME:-finntech_mydata}
      DB_USER: ${DB_USER:-finntech}
      DB_PASSWORD: ${DB_PASSWORD:?deploy/.env 에 DB_PASSWORD 를 넣어라}
      MYDATA_SHARED_SECRET: ${MYDATA_SHARED_SECRET:?deploy/.env 에 MYDATA_SHARED_SECRET 를 넣어라}
      # 비우면 실시간(system)이 서빙 커트오프가 된다. 고정할 때는 본체의 FINNTECH_DEMO_TODAY와 짝을 맞춘다(§8-D).
      MYDATA_NOW: ${MYDATA_NOW:-}
      # 실제 사람 1명의 카드내역 입력구(/admin/realdata). **실 개인정보**를 받고 파기까지 있다.
      # 기본 꺼짐 — 넣을 때만 켠다. 8082는 외부 미발행이지만 그 격리는 단층 방어라 여기서도 막는다.
      MYDATA_REALDATA_ENABLED: "${MYDATA_REALDATA_ENABLED:-false}"
      # 승인된 실사용자 신청의 적재구(/self/**). 위와 성질이 다르다 — 부르는 것은 본체뿐이고
      # (공유 시크릿 필터가 /self/** 도 검사한다) 본체는 admin 이 승인한 신청만 보낸다.
      # 데모 기간에만 켠다. 본체의 FINNTECH_INTAKE_ENABLED 와 짝이다(둘 다 켜야 흐른다).
      MYDATA_SELFIMPORT_ENABLED: "${MYDATA_SELFIMPORT_ENABLED:-false}"

      # ---- 실 신원 컬럼 암호화 (2026-08-13) ----
      # 본체는 신청 대기열을 처음부터 암호화했는데 **승인 뒤 오래 남는 이쪽이 평문이었다**
      # (실측 4,513행). 키는 본체와 따로 받는다 — 한쪽이 새도 다른 쪽이 함께 열리지 않게.
      MYDATA_CRYPTO_ENABLED: "${MYDATA_CRYPTO_ENABLED:-false}"
      # 운영에서 false 면 암호화가 꺼진 채 뜬다. CI 의 '운영 중지 검사'만 이 값을 넣는다.
      MYDATA_CRYPTO_REQUIRED: "${MYDATA_CRYPTO_REQUIRED:-true}"
      MYDATA_KMS_KEY_ID: ${MYDATA_KMS_KEY_ID:-}
      MYDATA_ENCRYPTED_DEK: ${MYDATA_ENCRYPTED_DEK:-}
      MYDATA_ENCRYPTED_PEPPER: ${MYDATA_ENCRYPTED_PEPPER:-}
      MYDATA_CRYPTO_BACKFILL: "${MYDATA_CRYPTO_BACKFILL:-true}"
      # KMS 클라이언트가 리전을 못 찾으면 생성 단계에서 죽어 앱이 통째로 안 뜬다(본체 전례).
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    mem_limit: 768m             # 힙 ≈ 460m. 조회 응답만 만들면 되는 서버라 이 정도면 충분하다.
    # **격리는 그대로, 구멍은 하나만.** 이 서버에는 실 개인정보가 있어 밖으로 나갈 일이 없다.
    # 다만 신원 컬럼을 KMS envelope 로 암호화하려면 기동 때 KMS 를 한 번 불러야 한다
    # (2026-08-13: 안 열어 둔 채 배포해 헬스체크에서 죽고 롤백됐다).
    #
    # 인터넷을 열어 주지 않는다. VPC 인터페이스 엔드포인트로 KMS 트래픽이 인터넷을 안 타게 하고
    # (프라이빗 DNS 로 `kms.…amazonaws.com` 이 VPC 내부 IP 로 풀린다), 이 망의 나가는 길은
    # `scripts/kms-egress-guard.sh` 가 **그 IP 의 443 하나로** 좁힌다. 나머지는 DROP 이다.
    networks: [internal, kms-egress]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-finntech}
      DB_USER: ${DB_USER:-finntech}
      DB_PASSWORD: ${DB_PASSWORD:?deploy/.env 에 DB_PASSWORD 를 넣어라}
      # 서비스명 DNS. 호스트나 포트를 아는 사람이 없어도 본체만 도달할 수 있다.
      MYDATA_BASE_URL: http://backend-mydata:8082
      MYDATA_SHARED_SECRET: ${MYDATA_SHARED_SECRET:?deploy/.env 에 MYDATA_SHARED_SECRET 를 넣어라}
      # 앱(Capacitor) 웹뷰 오리진 + 서비스 도메인. 웹은 같은 오리진이라 원래는 CORS가 필요 없지만,
      # 브라우저는 POST에 Origin을 붙이고 Spring은 프록시 뒤에서 스킴을 http로 보므로
      # 도메인을 넣지 않으면 같은 오리진인데도 403이 난다(server.forward-headers-strategy와 함께 해소).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-capacitor://localhost,https://localhost,http://localhost}
      # 일반 API로 더미 시드가 생성되면 안 된다(문서 §5-2 ④). 운영에서는 켜지 않는다.
      FINNTECH_DEV_SEED_ENABLED: "false"
      # ---- 인증 (설계서 Phase 1) ----
      # **끄지 않는다.** 끄면 `?userId=N`으로 남의 데이터가 그대로 열린다 — 도입 전 상태로 돌아간다.
      # 기본값을 true로 두되 .env가 덮을 수 있게 한다(끄는 경우가 있다면 그것이 기록에 남아야 한다).
      FINNTECH_AUTH_ENABLED: "${FINNTECH_AUTH_ENABLED:-true}"
      # https 뒤라 기본 true. 로컬 http 총연습에서만 false로 내린다.
      FINNTECH_SECURE_COOKIE: "${FINNTECH_SECURE_COOKIE:-true}"
      # 기동 1회용 admin 계정 생성. 값이 있으면 만들고 임시 비밀번호를 로그에 한 번 찍는다.
      # 받아 적은 뒤 .env에서 지운다 — 이미 있는 계정이면 아무것도 하지 않는다.
      FINNTECH_ADMIN_BOOTSTRAP: ${FINNTECH_ADMIN_BOOTSTRAP:-}
      # 잠겼을 때 빠져나오는 유일한 길 — 비밀번호·2단계 인증·세션을 처음 상태로 되돌린다.
      # **쓰고 나면 반드시 지운다.** 기동할 때마다 admin 이 초기화되면 그것도 잠김이다.
      FINNTECH_ADMIN_RESET: ${FINNTECH_ADMIN_RESET:-}
      # ---- 개인정보 컬럼 암호화 (Phase 2) ----
      # mysql 프로파일에서 꺼져 있으면 CryptoRequiredGuard가 기동을 막는다.
      # 조용히 평문으로 도는 것보다 기동이 실패하는 편이 낫다.
      FINNTECH_CRYPTO_ENABLED: "${FINNTECH_CRYPTO_ENABLED:-false}"
      # 가드를 끄는 스위치. **운영 .env 에는 넣지 않는다** — 기본값 true 가 그대로 산다.
      # CI 의 '운영 중지 검사'만 이 값을 넣는다(러너에 KMS 키가 없다).
      FINNTECH_CRYPTO_REQUIRED: "${FINNTECH_CRYPTO_REQUIRED:-true}"
      FINNTECH_KMS_KEY_ID: ${FINNTECH_KMS_KEY_ID:-}
      FINNTECH_ENCRYPTED_DEK: ${FINNTECH_ENCRYPTED_DEK:-}
      FINNTECH_ENCRYPTED_PEPPER: ${FINNTECH_ENCRYPTED_PEPPER:-}
      # AWS SDK 의 리전. **명시하지 않으면 IMDS 에 물어본다** — 컨테이너에서 그 길이 막히면
      # 리전을 못 찾아 KMS 클라이언트가 생성 단계에서 죽고, 앱이 통째로 안 뜬다.
      #
      # 2026-08-12 배포가 실제로 그렇게 실패했다. 인스턴스가 IMDSv2 강제에 **홉 제한 1** 이라
      # 컨테이너(홉 2)에서는 토큰조차 못 받았다. 홉을 2로 올려 고쳤지만, 리전만이라도
      # 여기서 못박아 두면 그 한 겹에 덜 기댄다. 자격증명은 여전히 인스턴스 역할에서 온다.
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # ---- 실사용자 신청·승인 (Phase 3) ----
      # 데모 기간에만 켠다. 끄면 신청·승인 경로가 통째로 404가 된다.
      FINNTECH_INTAKE_ENABLED: "${FINNTECH_INTAKE_ENABLED:-false}"
      # ---- 감사 앵커 외부 사본 (Phase 5-1) ----
      # TSA 토큰이 위조 대상과 같은 DB에 있으면 도장을 새로 받아 바꿔치기하는 공격이 통과한다.
      # Object Lock(Compliance) 버킷에 사본을 남겨야 그것이 드러난다.
      FINNTECH_ANCHOR_ARCHIVE_ENABLED: "${FINNTECH_ANCHOR_ARCHIVE_ENABLED:-false}"
      FINNTECH_ANCHOR_BUCKET: ${FINNTECH_ANCHOR_BUCKET:-}
      # 운영 관측(/api/ops/health)은 켜 둔다 — 개인정보가 없고, 켜야 볼 수 있는 관측은 안 보게 된다.
      FINNTECH_OPS_ENABLED: "${FINNTECH_OPS_ENABLED:-true}"
      # 시각 기준. 비우면 실시간. 고정할 때는 마이데이터의 MYDATA_NOW와 같은 날짜로 함께 넣는다(§8-D).
      FINNTECH_DEMO_TODAY: ${FINNTECH_DEMO_TODAY:-}
      FINNTECH_MYDATA_REFERENCE_DATE: ${FINNTECH_MYDATA_REFERENCE_DATE:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 모델이 사라지거나 할당량이 0이 되면 배포 없이 여기서 갈아탄다(2026-08-04 실제로 필요했다).
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # 금감원 오픈API 인증키. 비면 통장 비교가 더미로 폴백한다(화면에 '예시 데이터'로 표시).
      # 이 줄이 없어서 .env 에 키를 넣어도 컨테이너까지 오지 못했다 — 운영에서 실측(2026-08-04).
      FSS_API_KEY: ${FSS_API_KEY:-}
      # 등록 업종 조회(분류 순위 ②-b) — 사업자번호로 등록 업종을 되찾아 중분류를 정한다.
      # 주소·추출식이 저장소에 없는 이유는 조회처가 계약된 API 가 아니라 공개 페이지여서다.
      # 셋 중 하나라도 비면 통로가 조용히 꺼지고 분류는 종전대로 LLM 으로 내려간다.
      INDUSTRY_LOOKUP_ENABLED: ${INDUSTRY_LOOKUP_ENABLED:-false}
      INDUSTRY_LOOKUP_URL: ${INDUSTRY_LOOKUP_URL:-}
      INDUSTRY_LOOKUP_PATTERN: ${INDUSTRY_LOOKUP_PATTERN:-}
      # 같은 문서에서 주소도 뽑는다. 비우면 주소만 안 뽑고 업종 조회는 종전대로 돈다.
      INDUSTRY_LOOKUP_ADDRESS_PATTERN: ${INDUSTRY_LOOKUP_ADDRESS_PATTERN:-}
      # 임시 분류(②-c) — 무료 모델로 잠정 업종을 붙인다. 답은 DB 에 안 남고 화면 표시에만 쓴다.
      # 모델 이름을 환경변수로 두는 이유: 카탈로그에 있는데 404 인 모델이 실재한다(2026-08-07 실측).
      TEMP_CLASSIFIER_ENABLED: ${TEMP_CLASSIFIER_ENABLED:-false}
      TEMP_CLASSIFIER_URL: ${TEMP_CLASSIFIER_URL:-}
      TEMP_CLASSIFIER_KEY: ${TEMP_CLASSIFIER_KEY:-}
      TEMP_CLASSIFIER_MODEL: ${TEMP_CLASSIFIER_MODEL:-}
      # 무료 통로로 나가는 문의 예산·동시성·큐 상한. **컨테이너까지 전달해야** .env 가 효력을 갖는다
      # — 예전에 같은 실수를 한 적이 있다("새 환경변수를 컨테이너까지 전달한다", 2026-08-07).
      FREE_CHANNEL_PER_MINUTE: ${FREE_CHANNEL_PER_MINUTE:-40}
      FREE_CHANNEL_CONCURRENCY: ${FREE_CHANNEL_CONCURRENCY:-6}
      FREE_CHANNEL_MAX_QUEUED: ${FREE_CHANNEL_MAX_QUEUED:-500}
      TSA_ENABLED: ${TSA_ENABLED:-false}
    mem_limit: 1280m            # 힙 ≈ 768m. 분석 엔진·EBM 스코어러가 있어 넷 중 가장 크다.
    # internal로 마이데이터·DB에 닿고, edge로 Gemini·TSA·금리조회 아웃바운드를 유지한다.
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      backend-mydata:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # 빈 문자열 → 상대경로 → 같은 오리진. localhost 폴백이 운영 번들에 박히는 것을 막는다.
        VITE_API_BASE: ""
    # 127.0.0.1에만 바인딩한다. 외부에서 5173으로 직접 들어오는 길은 커널 수준에서 없고,
    # 공개는 호스트 nginx(TLS 종단)가 이 포트로 프록시하는 경로 하나뿐이다.
    ports:
      - "127.0.0.1:5173:80"
    mem_limit: 128m             # 정적 파일 서빙 + 프록시. 실측 5MiB.
    networks: [edge]
    healthcheck:
      # 127.0.0.1을 박아 쓴다. `localhost`는 컨테이너 안에서 ::1(IPv6)로 먼저 풀리는데
      # nginx.conf가 `listen 80`(IPv4 전용)이라 연결이 거부된다 — 사이트는 멀쩡한데
      # 헬스체크만 실패해 컨테이너가 영영 unhealthy로 남는다.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

networks:
  # internal: true — 이 망의 컨테이너는 밖으로 나가지도 못한다. DB와 마이데이터가 여기 있다.
  internal:
    internal: true
  edge:
  # 제공자가 **KMS 하나만** 부르려고 쓰는 망. 도커 수준에서는 평범한 브리지라 그대로 두면
  # 인터넷이 열린다 — 좁히는 것은 호스트의 iptables(`scripts/kms-egress-guard.sh`)다.
  # 대역을 여기 고정하는 이유가 그것이다. **이 값이 바뀌면 방화벽 규칙도 함께 바뀌어야 한다.**
  #
  # 172.20 이 아니라 172.21 인 이유: `app_default` 가 172.20.0.0/16 을 통째로 쓰고 있어
  # 겹쳤다(2026-08-13 배포 실패 — `Pool overlaps with other one on this address space`).
  # 쓰고 있는 대역은 172.17(bridge)·172.18(edge)·172.19(internal)·172.20(default) 이다.
  kms-egress:
    ipam:
      config:
        - subnet: 172.21.53.0/24

volumes:
  mysql-data:
