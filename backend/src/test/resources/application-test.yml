spring:
  datasource:
    # 테스트는 인메모리. 파일 DB를 쓰면 이전 실행 데이터가 남아 재현성 검증이 오염된다.
    url: jdbc:h2:mem:finntech-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

finntech:
  dev:
    seed-enabled: true
  gemini:
    # 테스트에서는 외부 호출을 하지 않는다 — 템플릿 폴백 경로를 검증한다.
    api-key: ""
  mydata:
    auto-sync:
      # 테스트에는 마이데이터 서버가 없다. 배치가 돌면 매 실행마다 연결 실패 로그만 쌓인다.
      enabled: false
  ledger:
    # 소비 원장 일감을 **부른 그 자리에서** 돌린다.
    # 배경 스레드로 두면 앞 시험이 낸 판정 기록이 뒤 시험의 deleteAll() 뒤에 도착해 없는 줄을
    # 고치려 든다(CI 실측 2026-08-14: StaleObjectStateException). 같은 스레드면 그 창이 없다.
    async: false
    drain:
      # 소비 원장 재작성이 **저절로** 돌지 않게 한다(나팔 + 주기 배치 둘 다).
      # 배경 스레드가 같은 줄을 쓰는 사이에 단정이 걸리면 경주가 된다 — 실제로 그래서
      # 시험 넷이 "표가 비었다"로 틀렸다(2026-08-14). 필요한 시험은 drainAll() 을 직접 부른다.
      enabled: false
    refresh:
      # 밤 판정 갱신도 저절로 돌지 않게 한다 — 같은 이유. 시험은 refreshStale() 을 직접 부른다.
      enabled: false
