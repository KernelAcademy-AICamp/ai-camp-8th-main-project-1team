# OIDC 토큰의 실제 클레임을 확인하기 위한 일회성 진단 워크플로.
#
# 배포가 "Not authorized to perform sts:AssumeRoleWithWebIdentity"로 계속 막히는데,
# 신뢰 정책의 조건(sub·repository)을 최대한 넓혀도 같은 결과였다. 즉 조건 문제가 아니라
# 발급자(iss)나 대상(aud)이 AWS에 등록된 것과 다르다는 뜻이다. 추측을 멈추고 값을 직접 본다.
#
# 토큰 자체는 절대 출력하지 않는다 — 그건 자격증명이다. 판정에 필요한 클레임만 찍는다.
# 원인 확인 후 이 파일은 지운다.
name: oidc-debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 클레임 출력
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::토큰을 못 받았다"; exit 1; }
          python3 - "$TOKEN" <<'PY'
          import sys, base64, json
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("=== AWS 신뢰 정책이 보는 값 ===")
          for k in ('iss', 'aud', 'sub', 'repository', 'repository_owner',
                    'job_workflow_ref', 'ref', 'workflow_ref'):
              print(f"  {k:18s} = {claims.get(k)}")
          PY
