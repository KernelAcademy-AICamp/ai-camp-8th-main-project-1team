# PR이 운영을 멈출 수 있는지 미리 밟아 본다.
#
# 왜 필요한가: 테스트는 H2로 돈다. H2에서는 Flyway가 스키마를 소유하지 않아
# **마이그레이션이 빠져도 초록불이 뜬다.** 실제로 두 번 같은 사고가 났다.
#
#   V6 — 지킴이 엔티티 9종만 올라가고 마이그레이션 누락 → 운영 기동 실패
#   V8 — birth_year 컬럼·product_eligibility 테이블 누락 → 운영 502, 약 15분
#
# 두 번 다 테스트는 전부 통과했다. 잡을 수 없는 검사를 늘리는 대신, **운영과 같은 조건으로
# 실제 기동해 본다.** MySQL 위에서 Flyway가 돌고 ddl-auto=validate가 도는 순간
# 스키마가 어긋나면 컨테이너가 healthy가 되지 못하고, 이 워크플로가 빨간불이 된다.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 단위·통합 테스트(H2). 로직 회귀를 잡는다 — 스키마 누락은 아래 boot가 잡는다.
  test:
    name: 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: [backend, backend-mydata]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: ${{ matrix.module }} 테스트
        working-directory: ${{ matrix.module }}
        run: ./mvnw -B test

  # 운영과 같은 방식으로 실제로 띄워 본다. 이 저장소에서 '깨진 배포'는 거의 전부
  # 기동 단계에서 죽는 형태였으므로, 기동이 되는지가 가장 값싼 최종 방어선이다.
  boot:
    name: 운영 조건 기동
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 개발 스택을 쓴다 — 컨테이너 이미지(Dockerfile), nginx.conf, MySQL 초기화 스크립트,
      # Flyway, validate가 모두 한 번에 지나간다. 운영 스택과 이미지가 같다.
      - name: 스택 빌드·기동
        env:
          MYDATA_SHARED_SECRET: ci-shared-secret
        run: docker compose up -d --build

      - name: 백엔드 기동 확인
        run: |
          # /api/mydata/companies 는 DB를 실제로 읽는다 — 커넥션·스키마까지 지난 뒤에야 200이 된다.
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/mydata/companies || true)
            [ "$code" = "200" ] && { echo "본체 기동 확인 (${i}회차)"; exit 0; }
            sleep 5
          done
          echo "::error::본체가 기동하지 못했습니다. 아래 로그에서 원인을 확인하세요."
          exit 1

      - name: 마이데이터 제공자 기동 확인
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/actuator/health || true)
            [ "$code" = "200" ] && { echo "제공자 기동 확인 (${i}회차)"; exit 0; }
            sleep 5
          done
          echo "::error::마이데이터 제공자가 기동하지 못했습니다."
          exit 1

      - name: 프론트(nginx) 확인
        run: |
          # nginx.conf 문법 오류는 빌드가 아니라 기동에서 드러난다.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            [ "$code" = "200" ] && { echo "프론트 기동 확인 (${i}회차)"; exit 0; }
            sleep 3
          done
          echo "::error::프론트가 기동하지 못했습니다."
          exit 1

      # 실패했을 때 원인을 바로 볼 수 있어야 한다 — 로그가 없으면 재현부터 다시 해야 한다.
      - name: 실패 시 로그
        if: failure()
        run: |
          docker compose ps -a
          for s in backend backend-mydata frontend mysql; do
            echo "::group::$s"
            docker compose logs --tail 120 "$s" 2>&1 | tail -120
            echo "::endgroup::"
          done

      - name: 정리
        if: always()
        run: docker compose down -v
