# 묻는 것은 하나다 — **이 커밋이 main에 올라가면 AWS 서버가 멈추는가.**
#
# 이 저장소에서 운영이 멈춘 사고는 전부 '기동 실패'였고, 두 번 다 테스트는 초록불이었다.
# 테스트가 H2로 돌아 Flyway가 스키마를 소유하지 않기 때문이다 — 마이그레이션이 빠져도
# 드러날 자리가 없다(V6 지킴이, V8 birth_year·product_eligibility).
#
# 그래서 검사를 늘리는 대신 **운영이 하는 일을 그대로 한다.**
#
#   1단계  지금 운영에 떠 있는 것(=base)을 먼저 띄운다   → DB가 출시된 스키마 상태가 된다
#   2단계  볼륨을 지우지 않고 이 커밋으로 갈아끼운다      → Flyway가 '증분'으로만 적용된다
#   3단계  스모크를 돌린다                                → 엔드포인트가 실제로 응답하는가
#
# 2단계가 핵심이다. 빈 DB에 V1부터 새로 적용하면 **통과하지만 운영에서는 실패하는** 마이그레이션이
# 있다(기존 행이 있는 테이블에 NOT NULL 컬럼 추가 등). 운영은 언제나 이미 적용된 DB 위에
# 증분으로 올라가므로, 그 경로를 그대로 밟아야 같은 답이 나온다.
#
# 한계(정직하게): CI의 DB에는 운영 데이터가 없다. 데이터에 의존해 실패하는 것
# (중복 값이 있는 컬럼에 UNIQUE 추가 등)은 여기서 잡히지 않는다.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

# 취소는 **같은 PR의 옛 커밋**에만 건다. develop 푸시는 커밋마다 따로 세운다.
#
# 왜 이렇게까지 하나 — `ci-${{ github.ref }}` 하나로 묶었더니 기능 브랜치의 PR 런이 뜰 때마다
# develop의 push 런이 2초 만에 취소됐다(2026-07-30, 809143a·43b876d 연속 2회). 그런데
# **main PR이 요구하는 검사가 그 develop push 런**이라, 검사가 깨진 것도 아닌데 배포가 막혔다.
# develop 푸시는 머지 하나마다 '이 커밋이 운영에 나가도 되는가'를 묻는 기록이므로,
# 뒤 커밋이 앞 커밋의 답을 지워서는 안 된다. 그래서 push 는 SHA 로 격리한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # 운영과 같은 파일을 쓴다. 개발 스택(docker-compose.yml)은 포트·프로파일·메모리 한도가 달라
  # 여기서 통과해도 운영에서 죽을 수 있다.
  CO: -f docker-compose.prod.yml -f docker-compose.prod.local-db.yml -f docker-compose.prod.large.yml --profile local-db --env-file deploy/ci.env

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: [backend, backend-mydata]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      # Maven 배포본을 먼저 받아 둔다. 받지 못하면 재시도한다.
      #
      # `mvnw`(only-script)는 매 실행마다 wget 으로 apache-maven-3.9.16-bin.zip 을 받는데,
      # repo.maven.apache.org 가 간헐적으로 끊긴다. 그러면 **테스트를 한 줄도 돌리기 전에**
      # 13초 만에 빨간불이 되고, 사람은 코드가 깨진 줄 안다. 같은 커밋에서 push 런은 통과하고
      # pull_request 런만 실패하는 것으로 네트워크 문제임이 드러났다.
      #
      # 여기서 받아 두면 `-o`(오프라인) 없이도 mvnw 가 캐시를 재사용한다. 세 번까지 시도하고
      # 그래도 안 되면 진짜 장애이므로 그때는 실패하는 것이 맞다.
      - name: Maven 배포본 준비(재시도)
        working-directory: ${{ matrix.module }}
        run: |
          for i in 1 2 3; do
            ./mvnw -B -q --version && exit 0
            echo "::warning::Maven 배포본 내려받기 실패 ($i/3) — 재시도"
            sleep $((i * 10))
          done
          echo "::error::Maven 배포본을 세 번 시도해도 받지 못했다"
          exit 1

      - name: ${{ matrix.module }} 테스트
        working-directory: ${{ matrix.module }}
        run: ./mvnw -B test

  outage:
    name: 운영 중지 검사
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 시크릿이 아니다 — CI 안에서만 살고 끝난다. 운영 값은 서버의 /opt/finntech/.env 에 있다.
      - name: CI용 환경파일
        run: |
          cat > deploy/ci.env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci-root
          DB_NAME=finntech
          DB_USER=finntech
          DB_PASSWORD=ci-pass
          DB_HOST=mysql
          DB_PORT=3306
          MYDATA_DB_NAME=finntech_mydata
          MYDATA_SHARED_SECRET=ci-shared-secret
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173
          TSA_ENABLED=false
          FINNTECH_DEV_SEED_ENABLED=false
          GEMINI_API_KEY=
          FSS_API_KEY=
          EOF

      # 비교 기준점. PR이면 병합될 대상(base), develop 푸시면 직전 커밋이 '지금 떠 있는 것'이다.
      - name: 기준 커밋 확인
        id: base
        run: |
          BASE='${{ github.event.pull_request.base.sha }}'
          [ -n "$BASE" ] || BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          [ -n "$BASE" ] && echo "기준 $(git log --oneline -1 "$BASE")" || echo "기준 없음 — 1단계를 건너뛴다"

      # ── 1단계 ── 지금 운영 상태를 재현한다. DB 볼륨이 '출시된 스키마'까지 올라간다.
      #
      # **기준 커밋이 무엇이든 이 단계는 이 잡을 죽이지 않는다.** 이 검사가 묻는 것은
      # "이 커밋이 main에 올라가면 서버가 멈추는가"이지 "직전 커밋이 멀쩡했는가"가 아니다.
      #
      # 실제로 그것 때문에 한 번 막혔다(2026-07-31). 컴파일이 깨진 커밋이 develop 에 들어갔고,
      # 바로 다음 커밋이 그것을 고쳤는데도 push 검사가 계속 빨간불이었다 — 1단계가 **직전 커밋**
      # (= 깨진 그것)을 빌드하다 죽었기 때문이다. 고친 커밋은 잘못이 없는데 통과할 길이 없었다.
      #
      # 기준을 못 세우면 2단계는 '빈 DB에서 시작'이 된다. 증분 마이그레이션 검증력은 그만큼
      # 줄지만, 그건 경고로 알리면 될 일이지 배포를 막을 일이 아니다.
      - name: 1단계 · 기준 커밋으로 기동
        if: steps.base.outputs.sha != ''
        continue-on-error: true
        run: |
          git checkout --quiet --detach '${{ steps.base.outputs.sha }}'
          git checkout --quiet '${{ github.sha }}' -- deploy/ci.env 2>/dev/null || true
          if ! docker compose $CO up -d --build; then
            echo "::warning::기준 커밋이 빌드되지 않는다 — 1단계를 건너뛴다. 2단계는 빈 DB에서 돈다"
            docker compose $CO down -v || true
            exit 0
          fi
          ./.github/wait-healthy.sh 4 || { echo "::warning::기준 커밋도 기동하지 못했다 — 비교 기준을 세울 수 없어 1단계를 넘긴다"; }
          docker compose $CO ps

      # ── 2단계 ── 볼륨을 지우지 않고 갈아끼운다. Flyway는 여기서 '증분'으로만 돈다.
      - name: 2단계 · 이 커밋으로 갈아끼우기
        run: |
          git checkout --quiet --force '${{ github.sha }}'
          docker compose $CO up -d --build
          ./.github/wait-healthy.sh 4

      # ── 3단계 ── 실제로 응답하는가. 배포 후 서버에서 돌리는 것과 같은 스크립트다.
      - name: 3단계 · 스모크
        run: BASE=http://127.0.0.1:5173 HOST=127.0.0.1 bash scripts/smoke.sh

      - name: 실패 시 로그
        if: failure()
        run: |
          docker compose $CO ps -a || true
          for s in backend backend-mydata frontend mysql; do
            echo "::group::$s"
            docker compose $CO logs --tail 150 "$s" 2>&1 | tail -150 || true
            echo "::endgroup::"
          done

      - name: 정리
        if: always()
        run: docker compose $CO down -v || true
