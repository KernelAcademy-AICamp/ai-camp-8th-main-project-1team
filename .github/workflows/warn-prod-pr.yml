name: Warn on PR to main

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 🚨 프로덕션 배포 경고',
                '',
                '이 PR이 머지되면 **`main` 브랜치가 갱신되어 AWS로 자동 재배포**됩니다.',
                '',
                '- 머지 전 `develop`에서 최종 동작 확인 필수',
                '- 마이그레이션/환경변수 변경 여부 재확인',
                '- 롤백 절차 숙지 후 머지',
                '',
                `@${context.payload.pull_request.user.login} 확인 부탁드립니다.`
              ].join('\n')
            });
